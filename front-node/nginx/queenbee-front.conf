# ─────────────────────────────────────────────────────────────────────────────
# queenbee-core-srv — front node
#
# Runs on the always-on box that HOLDS the MagicDNS name queenbee-core-srv.
# Tailscale Funnel terminates TLS and forwards to 127.0.0.1:8080; this server
# block decides where the visitor actually goes:
#
#   laptop up   -> proxy through to the real hub, URL unchanged
#   laptop down -> 302 to https://prajwalkamble.github.io/nightfury-server/
#
# Either way the visitor never sees a browser error page — first visit or
# hundredth, on or off the tailnet.
# ─────────────────────────────────────────────────────────────────────────────

# The laptop's tailnet address. Verify with `tailscale ip -4` ON THE LAPTOP.
# Hardcode the 100.x literal: a hostname here would stop nginx from starting
# at boot whenever the laptop happens to be offline.
map $host $laptop { default 100.126.54.0; }

server {
    listen 127.0.0.1:8080;
    server_name _;

    access_log /var/log/nginx/queenbee-front.access.log;
    error_log  /var/log/nginx/queenbee-front.error.log;

    # Fail fast. Without these, a visitor watches a blank tab for ~60 seconds
    # before the fallback fires — which defeats the whole point.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;
    proxy_intercept_errors on;

    location = / { return 302 /server/; }

    # ── The hub ──────────────────────────────────────────────────────────────
    location /server/ {
        proxy_pass http://$laptop:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The "=" matters: it tells nginx to take the response code from
        # @offline (302) instead of forcing the original 502. Without it the
        # browser gets a 502 carrying a Location header and refuses to follow.
        error_page 502 503 504 = @offline;
    }

    # ── Fallback: send the viewer to GitHub Pages ────────────────────────────
    location @offline {
        return 302 https://prajwalkamble.github.io/nightfury-server/;
    }

    # ── Liveness, for the GitHub Pages page to poll ──────────────────────────
    # 200 only while the laptop answers; 503 the moment it stops. CORS is open
    # so the browser can read the status code cross-origin.
    #
    # This endpoint is what stops the redirect loop. The Pages page must probe
    # /healthz, NOT /server/ — see docs/index.html, SERVER_URL.
    location = /healthz {
        proxy_pass http://$laptop:80/server/;
        proxy_method HEAD;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        error_page 502 503 504 = @healthdown;

        add_header Access-Control-Allow-Origin "*"      always;
        add_header Cache-Control "no-store, max-age=0"  always;
    }

    location @healthdown {
        add_header Access-Control-Allow-Origin "*"      always;
        add_header Cache-Control "no-store, max-age=0"  always;
        return 503 "down\n";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # ALTERNATIVE (not enabled): serve the offline page AT the .ts.net URL
    # instead of redirecting to Pages. The address bar then never leaves your
    # domain. To switch, replace the @offline block above with this one AND
    # drop the "=" from the error_page line, so the 502 status survives:
    #
    #     error_page 502 503 504 @offline;      # no "="
    #
    #     location @offline {
    #         root /var/www/offline;            # a copy of docs/index.html
    #         try_files /index.html =502;
    #         add_header Cache-Control "no-store" always;
    #     }
    #
    # With the "=" left in, nginx would return 200 for the offline page and
    # the page's own poll would read that as "server recovered" and reload
    # forever.
    # ─────────────────────────────────────────────────────────────────────────
}
